"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"

add_newline = true

format = """
$directory$git_branch$git_status$git_state$git_commit\
$nodejs$bun$python$rust$golang$java$gradle$package$mise$direnv\
$line_break$character"""

right_format = "$cmd_duration$status$jobs$time"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold purple)"
vimcmd_replace_symbol = "[❮](bold purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

[directory]
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
read_only = '🔒'


[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch ($remote_branch)]($style)"
truncation_length = 48
truncation_symbol = ''

[git_status]
disabled = true

[git_state]
style = "bold yellow"
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "

[git_commit]
tag_symbol = '  '
style = "bold yellow"
format = "[$hash$tag]($style) "

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "bold yellow"
format = "took [$duration]($style) "

[status]
disabled = false
style = "bold red"
symbol = "exit:"
format = "[$symbol$status]($style) "

[jobs]
symbol = "jobs:"
style = "bold blue"
format = "[$symbol$number]($style) "

[time]
disabled = false
style = "dimmed white"
format = "[$time]($style)"
time_format = "%H:%M"


[shell]
fish_indicator = 'fish'
bash_indicator = 'bash'
unknown_indicator = 'unknwn'
disabled = false

[gcloud]
symbol = "󱇶 "

[lua]
symbol = " "

[nodejs]
symbol = " "

[os.symbols]
CachyOS = " "
Debian = " "
Macos = " "
Linux = " "
Ubuntu = " "

[package]
symbol = "󰏗 "

[python]
symbol = " "
