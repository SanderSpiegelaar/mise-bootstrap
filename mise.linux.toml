
[bootstrap.groups.sander]

[bootstrap.groups.docker]

[bootstrap.users.sander]
group = "sander"
groups = ["sudo", "docker"]
home = "/home/sander"
shell = "/usr/bin/fish"
create_home = true

[bootstrap.files."/etc/sudoers.d/sander"]
source = "./files/sudoers/sander"
owner = "root"
group = "root"
mode = "0440"

# Sudo
[bootstrap.files."/etc/sudoers.d/sander"]
source = "../../files/sudoers/sander"
owner = "root"
group = "root"
mode = "0440"

## Docker
[bootstrap.directories."/etc/apt/keyrings"]
owner = "root"
group = "root"
mode = "0755"
phase = "pre-packages"

[bootstrap.files."/etc/apt/keyrings/docker.asc"]
source = "../../files/docker/docker.asc"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.files."/etc/apt/sources.list.d/docker.sources"]
source = "../../files/docker/docker.sources"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.files."/etc/docker/daemon.json"]
content = '{ "log-driver": "local" }'
notify = ["docker"]

## Fail2Ban
[bootstrap.files."/etc/fail2ban/jail.local"]
source = "../../files/fail2ban/jail.local"
owner = "root"
group = "root"
mode = "0644"
notify = ["fail2ban"]

## SSH
[bootstrap.files."/etc/ssh/sshd_config.d/99-hardening.conf"]
source = "../../files/ssh/99-hardening.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/sysctl.d/99-custom.conf"]
source = "../../files/sysctl/99-custom.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/etc/needrestart/conf.d/99-restart.conf"]
content = "$nrconf{restart} = 'a';\n"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.directories."/home/sander/.ssh"]
owner = "sander"
group = "sander"
mode = "0700"

[bootstrap.files."/home/sander/.ssh/authorized_keys"]
content = """
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINNjFhghHAGi7Y6BJu9RxQWHNUChrVD81EfnHxAfZRqX hetzner
"""
owner = "sander"
group = "sander"
mode = "0600"

[dotfiles]
"~/.config/starship.toml" = "./dotfiles/starship.toml"
"~/.config/topgrade.toml" = "./dotfiles/topgrade.toml"

"~/.config/eza" = "./dotfiles/eza"
"~/.config/superfile" = "./dotfiles/superfile"
"~/.config/nvim" = "./dotfiles/nvim"
"~/.config/fish" = "./dotfiles/fish"
"~/.config/atuin" = "./dotfiles/atuin"
"~/.config/bat" = "./dotfiles/bat"


[tasks.bootstrap]
description = "Finish user and system setup"
dir = "{{ config_root }}"
run = [
  "fish scripts/install-fisher.fish",
  "fish scripts/generate-completions.fish",
  "git config --global user.name 'Sander'",
  "git config --global user.email 'sanderspiegelaar@gmail.com'",
  "tldr --update",
  "sudo sysctl --system",
  "sudo /usr/sbin/sshd -t && sudo systemctl reload ssh",
]
