


[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:procps" = "latest"
"apt:file" = "latest"
"apt:docker-ce" = "latest"
"apt:docker-ce-cli" = "latest"
"apt:containerd.io" = "latest"
"apt:docker-buildx-plugin" = "latest"
"apt:docker-compose-plugin" = "latest"


[bootstrap.directories."/etc/apt/keyrings"]
owner = "root"
group = "root"
mode = "0755"
phase = "pre-packages"


[bootstrap.files."/etc/apt/keyrings/docker.asc"]
source = "./files/docker/docker.asc"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.files."/etc/apt/sources.list.d/docker.sources"]
source = "./files/docker/docker.sources"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.files."/etc/apt/keyrings/docker.asc"]
source = "./files/docker.asc"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

[bootstrap.files."/etc/apt/sources.list.d/docker.sources"]
source = "./files/docker.sources"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"
